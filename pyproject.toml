[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchharbor"
version = "0.1.0"
description = "Controlled runner for generated Bash and PowerShell scripts."
keywords = ["bash", "cli", "powershell", "script-runner"]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "PatchHarbor contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Shells",
]

dependencies = []

[project.scripts]
patchharbor = "patchharbor.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pipx>=1.7",
  "pytest>=7.4",
  "pytest-timeout>=2.4",
  "setuptools>=68",
  "wheel>=0.43"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["patchharbor*"]
