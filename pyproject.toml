[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchharbor"
dynamic = ["version"]
description = "Controlled cross-platform runner for generated Bash and PowerShell scripts and ZIP PatchBundles."
keywords = ["bash", "cli", "patch-bundle", "powershell", "script-runner", "zip"]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Christian Döhn" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Shells",
]

dependencies = []

[project.scripts]
patchharbor = "patchharbor.cli:main"
patchharbor-watcher = "patchharbor_watcher.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pipx>=1.7",
  "pytest>=7.4",
  "pytest-timeout>=2.4",
  "setuptools>=77",
  "wheel>=0.43"
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "acceptance: public cross-platform acceptance workflow",
  "e2e: end-to-end CLI behavior",
  "platform: platform-specific integration behavior",
  "packaging: wheel and pipx packaging behavior"
]

[tool.setuptools.dynamic]
version = { attr = "patchharbor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["patchharbor", "patchharbor.*", "patchharbor_watcher", "patchharbor_watcher.*"]

[tool.setuptools.data-files]
"share/patchharbor" = ["CHAT_INSTRUCTIONS.md"]
