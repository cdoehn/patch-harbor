[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchharbor"
version = "0.1.0"
description = "Repository-agnostic development scripts and patch workflow tools."
keywords = ["cli", "development-tools", "patch-workflow", "repository-automation"]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "PatchHarbor contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]

dependencies = []

[project.scripts]
patchharbor = "patchharbor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-timeout>=2.4"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["patchharbor*"]
