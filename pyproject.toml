[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchharbor"
version = "0.1.0"
description = "Repository-agnostic development scripts and patch workflow tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "PatchHarbor contributors" }
]
dependencies = []

[project.scripts]
patchharbor = "patchharbor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.4"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["patchharbor*"]
