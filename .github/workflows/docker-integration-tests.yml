name: Docker Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: PatchHarbor Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Umgebung anzeigen
        run: |
          docker --version
          git --no-pager log -1 --oneline

      - name: Docker-Integrationstests ausführen
        shell: bash
        run: |
          chmod +x scripts/run_docker_integration_tests.sh
          timeout \
            --signal=TERM \
            --kill-after=60s \
            25m \
            bash scripts/run_docker_integration_tests.sh

      - name: Docker-Diagnose bei Fehler
        if: failure()
        shell: bash
        run: |
          echo "=== Container ==="
          docker ps -a || true
          echo "=== Images ==="
          docker images || true

      - name: Docker aufräumen
        if: always()
        shell: bash
        run: |
          docker ps -aq | xargs -r docker rm -f || true
