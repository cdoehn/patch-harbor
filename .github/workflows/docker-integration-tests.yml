name: Docker integration tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-integration:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        ubuntu:
          - "24.04"
          - "26.04"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image and run tests
        env:
          PATCHHARBOR_DOCKER_LOG_DIR: ${{ runner.temp }}/patchharbor-docker-integration/ubuntu-${{ matrix.ubuntu }}
        run: ./scripts/run_docker_integration_tests.sh "${{ matrix.ubuntu }}"

      - name: Upload Docker integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patchharbor-docker-ubuntu-${{ matrix.ubuntu }}
          path: ${{ runner.temp }}/patchharbor-docker-integration/ubuntu-${{ matrix.ubuntu }}
          if-no-files-found: error
          retention-days: 14
