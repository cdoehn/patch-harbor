name: PatchHarbor acceptance tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
          - name: Ubuntu 26.04
            runner: ubuntu-26.04
          - name: Windows 2025
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Verify Windows PowerShell and PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command powershell.exe -ErrorAction Stop
          Get-Command pwsh -ErrorAction Stop
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion'
          pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion'

      - name: Run complete unit, E2E, packaging, and acceptance suite
        run: python -m pytest -q --timeout=120 tests
