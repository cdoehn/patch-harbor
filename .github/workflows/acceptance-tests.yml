name: PatchHarbor acceptance tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.preview }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release gate - Ubuntu 24.04
            runner: ubuntu-24.04
            preview: false
          - name: Release gate - Windows 2025
            runner: windows-2025
            preview: false
          - name: Preview - Ubuntu 26.04
            runner: ubuntu-26.04
            preview: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Verify Windows PowerShell and PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command powershell.exe -ErrorAction Stop
          Get-Command pwsh -ErrorAction Stop
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion'
          pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion'

      - name: Run core and architecture tests
        run: >-
          python -m pytest -q --timeout=120 --durations=10
          -m "not e2e and not acceptance and not platform and not packaging"
          tests

      - name: Run E2E and acceptance tests
        run: >-
          python -m pytest -q --timeout=120 --durations=10
          -m "e2e or acceptance"
          tests

      - name: Run platform tests
        run: >-
          python -m pytest -q --timeout=120 --durations=10
          -m "platform"
          tests

      - name: Run packaging tests
        run: >-
          python -m pytest -q --timeout=120 --durations=10
          -m "packaging"
          tests
