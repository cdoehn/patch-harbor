name: PatchHarbor acceptance tests
run-name: PatchHarbor acceptance - ${{ inputs.handoff_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      handoff_id:
        description: Optional unique handoff identity (no automatic retry)
        type: string
        default: ""
      expected_commit:
        description: Optional full pushed commit required by the handoff
        type: string
        default: ""

env:
  PATCHHARBOR_EXPECTED_COMMIT: ${{ inputs.expected_commit }}

permissions:
  contents: read

jobs:
  acceptance:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PATCHHARBOR_WINDOWS_ACCEPTANCE_ENGINE: ${{ matrix.windows_engine }}

    strategy:
      fail-fast: false
      # BEGIN acceptance-catalog: acceptance
      matrix:
        include:
          - name: "Release gate - Ubuntu 24.04 - Python 3.10"
            runner: "ubuntu-24.04"
            python: "3.10"
            windows_engine: ""
            artifact: "patchharbor-packaging-ubuntu-24.04-py3.10"
          - name: "Release gate - Ubuntu 24.04 - Python 3.11"
            runner: "ubuntu-24.04"
            python: "3.11"
            windows_engine: ""
            artifact: "patchharbor-packaging-ubuntu-24.04-py3.11"
          - name: "Release gate - Ubuntu 24.04 - Python 3.12"
            runner: "ubuntu-24.04"
            python: "3.12"
            windows_engine: ""
            artifact: "patchharbor-packaging-ubuntu-24.04-py3.12"
          - name: "Release gate - Windows 2025 - Python 3.10"
            runner: "windows-2025"
            python: "3.10"
            windows_engine: "powershell.exe"
            artifact: "patchharbor-packaging-windows-2025-py3.10"
          - name: "Release gate - Windows 2025 - Python 3.11"
            runner: "windows-2025"
            python: "3.11"
            windows_engine: "powershell.exe"
            artifact: "patchharbor-packaging-windows-2025-py3.11"
          - name: "Release gate - Windows 2025 - Python 3.12"
            runner: "windows-2025"
            python: "3.12"
            windows_engine: "powershell.exe"
            artifact: "patchharbor-packaging-windows-2025-py3.12"
          - name: "Release gate - Ubuntu 26.04 - Python 3.14"
            runner: "ubuntu-26.04"
            python: "3.14"
            windows_engine: ""
            artifact: "patchharbor-packaging-ubuntu-26.04-py3.14"
      # END acceptance-catalog: acceptance

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Check generated acceptance matrix
        run: python scripts/render_acceptance_matrix.py --check

      - name: Verify requested commit
        run: python -c "import os,subprocess; expected=os.environ['PATCHHARBOR_EXPECTED_COMMIT']; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); assert not expected or actual == expected"

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Prepare representative uv installation route
        if: matrix.runner == 'ubuntu-26.04'
        run: python -m pip install --disable-pip-version-check uv

      - name: Verify Windows PowerShell and PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command powershell.exe -ErrorAction Stop
          Get-Command pwsh -ErrorAction Stop
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion'
          pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion'

      - name: Capture audited build and interpreter evidence
        run: python scripts/capture_ci_build.py --report "${{ runner.temp }}/patchharbor-build.json"

      - name: Run core and architecture tests
        run: >-
          python tools/run_tests.py --suite core --durations=10
          --report "${{ runner.temp }}/patchharbor-core-tests.json"

      - name: Run E2E and acceptance tests
        run: >-
          python tools/run_tests.py --suite e2e --durations=10
          --report "${{ runner.temp }}/patchharbor-e2e-tests.json"

      - name: Run platform tests
        run: >-
          python tools/run_tests.py --suite platform --durations=10
          --report "${{ runner.temp }}/patchharbor-platform-tests.json"

      - name: Run packaging tests
        run: >-
          python tools/run_tests.py --suite packaging --durations=10
          --report "${{ runner.temp }}/patchharbor-packaging-tests.json"

      - name: Upload native packaging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/patchharbor-build.json
            ${{ runner.temp }}/patchharbor-core-tests.json
            ${{ runner.temp }}/patchharbor-e2e-tests.json
            ${{ runner.temp }}/patchharbor-platform-tests.json
            ${{ runner.temp }}/patchharbor-packaging-tests.json
          if-no-files-found: error
          retention-days: 14

  windows-powershell7-acceptance:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PATCHHARBOR_WINDOWS_ACCEPTANCE_ENGINE: ${{ matrix.windows_engine }}

    strategy:
      fail-fast: false
      # BEGIN acceptance-catalog: windows-powershell7-acceptance
      matrix:
        include:
          - name: "Release gate - Windows 2025 - PowerShell 7 - Python 3.10"
            runner: "windows-2025"
            python: "3.10"
            windows_engine: "pwsh"
            artifact: "patchharbor-windows-powershell7-py3.10"
          - name: "Release gate - Windows 2025 - PowerShell 7 - Python 3.11"
            runner: "windows-2025"
            python: "3.11"
            windows_engine: "pwsh"
            artifact: "patchharbor-windows-powershell7-py3.11"
          - name: "Release gate - Windows 2025 - PowerShell 7 - Python 3.12"
            runner: "windows-2025"
            python: "3.12"
            windows_engine: "pwsh"
            artifact: "patchharbor-windows-powershell7-py3.12"
      # END acceptance-catalog: windows-powershell7-acceptance

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check generated acceptance matrix
        run: python scripts/render_acceptance_matrix.py --check

      - name: Verify requested commit
        run: python -c "import os,subprocess; expected=os.environ['PATCHHARBOR_EXPECTED_COMMIT']; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); assert not expected or actual == expected"

      - name: Verify PowerShell 7
        shell: pwsh
        run: Get-Command pwsh -ErrorAction Stop

      - name: Capture audited build and interpreter evidence
        run: python scripts/capture_ci_build.py --report "${{ runner.temp }}/patchharbor-build.json"

      - name: Run native Windows PowerShell 7 acceptance
        shell: pwsh
        run: >-
          python tools/run_tests.py --suite windows --durations=10
          --report "${{ runner.temp }}/patchharbor-windows-tests.json"

      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/patchharbor-build.json
            ${{ runner.temp }}/patchharbor-windows-tests.json
          if-no-files-found: error
          retention-days: 14

  ubuntu-docker-integration:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      # BEGIN acceptance-catalog: ubuntu-docker-integration
      matrix:
        include:
          - name: "Docker release gate - Ubuntu 24.04"
            runner: "ubuntu-24.04"
            python: "3.12"
            windows_engine: ""
            artifact: "patchharbor-docker-ubuntu-24.04"
            ubuntu: "24.04"
          - name: "Docker release gate - Ubuntu 26.04"
            runner: "ubuntu-24.04"
            python: "3.12"
            windows_engine: ""
            artifact: "patchharbor-docker-ubuntu-26.04"
            ubuntu: "26.04"
      # END acceptance-catalog: ubuntu-docker-integration

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check generated acceptance matrix
        run: python3 scripts/render_acceptance_matrix.py --check

      - name: Build image and run blocking integration gates
        env:
          PATCHHARBOR_DOCKER_LOG_DIR: ${{ runner.temp }}/patchharbor-docker-integration/ubuntu-${{ matrix.ubuntu }}
        run: |
          if [ -n "$PATCHHARBOR_EXPECTED_COMMIT" ]; then
            test "$(git rev-parse HEAD)" = "$PATCHHARBOR_EXPECTED_COMMIT"
          fi
          ./scripts/run_docker_integration_tests.sh "${{ matrix.ubuntu }}"

      - name: Upload Docker integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/patchharbor-docker-integration/ubuntu-${{ matrix.ubuntu }}
            !${{ runner.temp }}/patchharbor-docker-integration/ubuntu-${{ matrix.ubuntu }}/patchharbor-build-artifacts/**
          if-no-files-found: error
          retention-days: 14
